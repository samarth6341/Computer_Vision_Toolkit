<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Cube 3D Puzzle</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1d2133 0%, #0b0d15 65%);
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      min-width: 320px;
      max-width: min(42vw, 540px);
      background: rgba(15, 19, 30, 0.8);
      border: 1px solid rgba(130, 152, 196, 0.35);
      border-radius: 12px;
      padding: 12px 14px;
      backdrop-filter: blur(8px);
      color: #dce8ff;
      z-index: 20;
      line-height: 1.42;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
      user-select: none;
    }

    #hud h1 {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f5f8ff;
    }

    #hud p {
      margin: 4px 0;
      font-size: 0.86rem;
      color: #bfd2ff;
    }

    #status {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(130, 152, 196, 0.25);
      font-size: 0.84rem;
      white-space: pre-line;
    }

    .kbd {
      display: inline-block;
      border: 1px solid rgba(194, 219, 255, 0.45);
      border-radius: 6px;
      padding: 0 6px;
      margin: 0 2px;
      font-size: 0.8rem;
      color: #eff5ff;
      background: rgba(89, 127, 218, 0.24);
    }

    #toast {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(26, 35, 53, 0.88);
      border: 1px solid rgba(143, 175, 255, 0.35);
      color: #e4efff;
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      z-index: 30;
      max-width: min(45vw, 360px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      #hud {
        max-width: calc(100vw - 24px);
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Snake Cube 3D Puzzle</h1>
    <p>Click any <b>hinge</b> cube (gold) to rotate the tail from that point.</p>
    <p><span class="kbd">X</span> <span class="kbd">Y</span> <span class="kbd">Z</span> choose axis. <span class="kbd">R</span>/<span class="kbd">F</span> rotate selected hinge ±90°.</p>
    <p><span class="kbd">Q</span>/<span class="kbd">E</span> cycle hinge. <span class="kbd">U</span> undo. <span class="kbd">S</span> scramble. <span class="kbd">0</span> reset.</p>
    <div id="status"></div>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d15);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 800);
    camera.position.set(13, 14, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 10;
    controls.maxDistance = 45;
    controls.target.set(0.5, 0.5, 0.5);

    const hemi = new THREE.HemisphereLight(0xb9ccff, 0x1d1520, 0.8);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);
    keyLight.position.set(12, 14, 8);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8fa3d8, 0.35);
    fillLight.position.set(-8, 5, -10);
    scene.add(fillLight);

    const grid = new THREE.GridHelper(20, 20, 0x334466, 0x223047);
    grid.position.y = -1.5;
    scene.add(grid);

    const bbox = new THREE.Box3Helper(new THREE.Box3(new THREE.Vector3(-0.5, -0.5, -0.5), new THREE.Vector3(2.5, 2.5, 2.5)), 0x5874ad);
    scene.add(bbox);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const CHAIN_LENGTH = 27;
    const hinges = [];
    const cubes = [];
    const history = [];
    let selectedHinge = -1;

    const axisMap = {
      x: new THREE.Vector3(1, 0, 0),
      y: new THREE.Vector3(0, 1, 0),
      z: new THREE.Vector3(0, 0, 1)
    };
    let currentAxisKey = "x";

    const toastEl = document.getElementById("toast");
    const statusEl = document.getElementById("status");
    let toastTimer = null;

    const bodyGeo = new THREE.BoxGeometry(0.93, 0.93, 0.93);
    const hingeGeo = new THREE.BoxGeometry(0.93, 0.93, 0.93);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2f9d61, roughness: 0.58, metalness: 0.08 });
    const hingeMat = new THREE.MeshStandardMaterial({ color: 0xe2cc85, roughness: 0.55, metalness: 0.05 });
    const selectedMat = new THREE.MeshStandardMaterial({ color: 0xff9255, roughness: 0.5, metalness: 0.15, emissive: 0x552200, emissiveIntensity: 0.55 });

    const pivotMarker = new THREE.Mesh(
      new THREE.TorusGeometry(0.62, 0.05, 20, 48),
      new THREE.MeshBasicMaterial({ color: 0x89c0ff, transparent: true, opacity: 0.68 })
    );
    pivotMarker.visible = false;
    scene.add(pivotMarker);

    let animation = null;

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function buildInitialChain() {
      for (let i = 0; i < CHAIN_LENGTH; i++) {
        const cube = new THREE.Mesh(bodyGeo, bodyMat.clone());
        cube.userData.index = i;
        cubes.push(cube);
        scene.add(cube);
      }

      // Deterministic "snake" layout with bends every other segment.
      const path = [];
      let p = new THREE.Vector3(0, 0, 0);
      const dirs = [
        new THREE.Vector3(1, 0, 0),
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(0, 0, 1),
        new THREE.Vector3(-1, 0, 0),
        new THREE.Vector3(0, -1, 0),
        new THREE.Vector3(0, 0, -1)
      ];
      let dir = dirs[0].clone();
      for (let i = 0; i < CHAIN_LENGTH; i++) {
        path.push(p.clone());
        p = p.clone().add(dir);
        if (i % 2 === 1 && i < CHAIN_LENGTH - 1) {
          const prev = dir.clone();
          const candidates = dirs.filter(d => !d.equals(prev) && !d.equals(prev.clone().negate()));
          dir = candidates[(i * 7) % candidates.length].clone();
        }
      }

      for (let i = 0; i < cubes.length; i++) {
        cubes[i].position.copy(path[i]);
        const isHinge = i > 0 && i < CHAIN_LENGTH - 1 && i % 2 === 1;
        cubes[i].userData.isHinge = isHinge;
        if (isHinge) hinges.push(i);
      }

      centerChain();
      applyVisualState();
    }

    function applyVisualState() {
      for (let i = 0; i < cubes.length; i++) {
        const cube = cubes[i];
        if (cube.userData.isHinge) {
          cube.material = selectedHinge === i ? selectedMat : hingeMat;
        } else {
          cube.material = bodyMat;
        }
      }

      if (selectedHinge >= 0) {
        pivotMarker.visible = true;
        pivotMarker.position.copy(cubes[selectedHinge].position);
      } else {
        pivotMarker.visible = false;
      }

      updateStatus();
    }

    function getChainSnapshot() {
      return cubes.map(cube => cube.position.clone());
    }

    function restoreSnapshot(snapshot) {
      for (let i = 0; i < cubes.length; i++) {
        cubes[i].position.copy(snapshot[i]);
      }
      centerChain();
    }

    function centerChain() {
      const bounds = new THREE.Box3().setFromPoints(cubes.map(c => c.position));
      const center = bounds.getCenter(new THREE.Vector3());
      for (const cube of cubes) {
        cube.position.sub(center);
        cube.position.x = Math.round(cube.position.x);
        cube.position.y = Math.round(cube.position.y);
        cube.position.z = Math.round(cube.position.z);
      }
    }

    function hasCollisions() {
      const seen = new Set();
      for (const c of cubes) {
        const key = `${c.position.x}|${c.position.y}|${c.position.z}`;
        if (seen.has(key)) return true;
        seen.add(key);
      }
      return false;
    }

    function checkAdjacencyIntegrity() {
      for (let i = 0; i < cubes.length - 1; i++) {
        const a = cubes[i].position;
        const b = cubes[i + 1].position;
        const manhattan = Math.abs(a.x - b.x) + Math.abs(a.y - b.y) + Math.abs(a.z - b.z);
        if (manhattan !== 1) return false;
      }
      return true;
    }

    function isSolvedCube() {
      const min = new THREE.Vector3(Infinity, Infinity, Infinity);
      const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
      const occupied = new Set();
      for (const c of cubes) {
        const p = c.position;
        min.min(p);
        max.max(p);
        occupied.add(`${p.x},${p.y},${p.z}`);
      }
      const size = max.clone().sub(min).addScalar(1);
      if (!(size.x === 3 && size.y === 3 && size.z === 3)) return false;

      for (let x = min.x; x <= max.x; x++) {
        for (let y = min.y; y <= max.y; y++) {
          for (let z = min.z; z <= max.z; z++) {
            if (!occupied.has(`${x},${y},${z}`)) return false;
          }
        }
      }
      return true;
    }

    function commitRotation(index, axis, direction) {
      const pivot = cubes[index].position.clone();
      const angle = direction * Math.PI / 2;
      for (let i = index + 1; i < cubes.length; i++) {
        const rel = cubes[i].position.clone().sub(pivot).applyAxisAngle(axis, angle);
        cubes[i].position.copy(pivot.clone().add(rel));
        cubes[i].position.x = Math.round(cubes[i].position.x);
        cubes[i].position.y = Math.round(cubes[i].position.y);
        cubes[i].position.z = Math.round(cubes[i].position.z);
      }
    }

    function rotateSelected(direction) {
      if (animation || selectedHinge < 0) return;
      const axis = axisMap[currentAxisKey].clone();
      const before = getChainSnapshot();
      const pivot = cubes[selectedHinge].position.clone();

      commitRotation(selectedHinge, axis, direction);

      const valid = !hasCollisions() && checkAdjacencyIntegrity();
      if (!valid) {
        restoreSnapshot(before);
        showToast("Invalid move: collision or broken chain.");
        return;
      }

      const after = getChainSnapshot();
      restoreSnapshot(before);
      history.push(before.map(p => p.clone()));

      animation = {
        start: performance.now(),
        duration: 230,
        index: selectedHinge,
        axis,
        direction,
        from: before,
        to: after
      };
    }

    function updateAnimation(now) {
      if (!animation) return;
      const t = Math.min(1, (now - animation.start) / animation.duration);
      const eased = 1 - Math.pow(1 - t, 3);

      const pivot = animation.from[animation.index].clone();
      const angle = animation.direction * (Math.PI / 2) * eased;

      for (let i = 0; i <= animation.index; i++) {
        cubes[i].position.copy(animation.from[i]);
      }
      for (let i = animation.index + 1; i < cubes.length; i++) {
        const rel = animation.from[i].clone().sub(pivot).applyAxisAngle(animation.axis, angle);
        cubes[i].position.copy(pivot.clone().add(rel));
      }

      if (t >= 1) {
        for (let i = 0; i < cubes.length; i++) {
          cubes[i].position.copy(animation.to[i]);
        }
        centerChain();
        animation = null;

        if (isSolvedCube()) {
          showToast("Solved! Perfect 3×3×3 cube achieved.");
        }
      }
    }

    function cycleHinge(delta) {
      if (hinges.length === 0) return;
      let idx = hinges.indexOf(selectedHinge);
      if (idx === -1) idx = 0;
      idx = (idx + delta + hinges.length) % hinges.length;
      selectedHinge = hinges[idx];
      applyVisualState();
    }

    function pickHinge(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(cubes, false)[0];
      if (!hit) return;

      const i = hit.object.userData.index;
      if (!cubes[i].userData.isHinge) {
        showToast("Only hinge cubes can rotate the tail.");
        return;
      }

      selectedHinge = i;
      applyVisualState();
      rotateSelected(1);
    }

    function scramble(steps = 28) {
      let safety = 0;
      while (steps > 0 && safety < 300) {
        safety++;
        const idx = hinges[(Math.random() * hinges.length) | 0];
        const axisKeys = ["x", "y", "z"];
        const key = axisKeys[(Math.random() * axisKeys.length) | 0];
        const direction = Math.random() < 0.5 ? 1 : -1;

        const before = getChainSnapshot();
        commitRotation(idx, axisMap[key], direction);
        if (hasCollisions() || !checkAdjacencyIntegrity()) {
          restoreSnapshot(before);
          continue;
        }
        history.push(before);
        centerChain();
        steps--;
      }
      applyVisualState();
    }

    function resetPuzzle() {
      history.length = 0;
      for (const c of cubes) scene.remove(c);
      cubes.length = 0;
      hinges.length = 0;
      selectedHinge = -1;
      animation = null;
      buildInitialChain();
      selectedHinge = hinges[Math.floor(hinges.length / 2)];
      applyVisualState();
      showToast("Puzzle reset.");
    }

    function undo() {
      if (animation || history.length === 0) return;
      const last = history.pop();
      restoreSnapshot(last);
      applyVisualState();
      showToast("Undid previous move.");
    }

    function updateStatus() {
      const hingeLabel = selectedHinge >= 0 ? `#${selectedHinge}` : "none";
      const solvedText = isSolvedCube() ? "YES ✅" : "no";
      statusEl.textContent = `Selected hinge: ${hingeLabel}\nAxis: ${currentAxisKey.toUpperCase()}\nMoves stored: ${history.length}\nSolved 3×3×3: ${solvedText}`;
    }

    window.addEventListener("click", (e) => {
      pickHinge(e.clientX, e.clientY);
    });

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key in axisMap) {
        currentAxisKey = key;
        applyVisualState();
        showToast(`Axis changed to ${key.toUpperCase()}`);
      } else if (key === "r") {
        rotateSelected(1);
      } else if (key === "f") {
        rotateSelected(-1);
      } else if (key === "q") {
        cycleHinge(-1);
      } else if (key === "e") {
        cycleHinge(1);
      } else if (key === "u") {
        undo();
      } else if (key === "s") {
        if (!animation) {
          scramble(30);
          showToast("Scrambled using valid random folds.");
        }
      } else if (key === "0") {
        resetPuzzle();
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(now = 0) {
      requestAnimationFrame(animate);
      controls.update();
      updateAnimation(now);
      renderer.render(scene, camera);
    }

    buildInitialChain();
    selectedHinge = hinges[Math.floor(hinges.length / 2)];
    applyVisualState();
    animate();
  </script>
</body>
</html>
